services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: numetal_db
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  api:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: numetal_db
    depends_on:
      - db
    networks:
      - app-network

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - app-network
    volumes:
      - ./frontend:/app        
      - /app/node_modules

volumes:
  db_data:

networks:
  app-network: